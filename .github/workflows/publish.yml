name: Collect and Publish Camelot-SEER

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: model-observatory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Restore verified observations and retained snapshots
        uses: actions/cache@v4
        with:
          path: |
            .cache
            public/api/v2/snapshots
            public/api/camelot-v1/snapshots
          key: arena-v2-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            arena-v2-${{ github.ref_name }}-
      - name: Collect (maximum five seconds per source, then cache or seed)
        run: python -m observatory build
      - run: python -m observatory validate public/api/v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test clients/tests/reader.test.mjs
      - name: Enforce public file allowlist
        run: python -c "from pathlib import Path; from observatory.build import public_files; print(public_files(Path('public')))"
      - name: Verify generated schema is committed
        run: |
          python -m observatory schema
          git diff --exit-code -- schema/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy static registry
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify live Pages feeds and Camelot projection
        run: python -m scripts.check-pages '${{ steps.deployment.outputs.page_url }}'
